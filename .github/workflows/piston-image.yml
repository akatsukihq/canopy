name: Build Piston image

# Builds ghcr.io/akatsukihq/canopy-piston (public, no secrets inside) and runs every registry version's starter.
# Push to a piston/** branch: build + verify only. Push to main (only when Piston files change) or a manual run:
# build + verify + publish.
# See docs/code-execution.md and openspec/changes/add-online-compilers/design.md section 1a.
on:
  push:
    branches: ["piston/**", main]
    # Applies to main too: other main pushes never build this 7.5 GB image.
    paths:
      - "scripts/piston/**"
      - ".github/workflows/piston-image.yml"
  workflow_dispatch:
    inputs:
      piston_sha:
        description: Upstream engineer-man/piston commit (full 40-char SHA)
        required: true
        default: de2b365ac759670a3a0d13ea208a0869a92c7e64

permissions:
  contents: read
  packages: write

concurrency:
  group: piston-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Validate inputs and compute tag
        id: meta
        env:
          PISTON_SHA: ${{ inputs.piston_sha || 'de2b365ac759670a3a0d13ea208a0869a92c7e64' }}
        run: |
          set -euo pipefail
          [[ "$PISTON_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "piston_sha must be a full lowercase 40-char SHA" >&2; exit 1; }
          echo "sha=$PISTON_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=${PISTON_SHA:0:7}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # The image is ~7.5 GB plus build cache; the runner image's preinstalled SDKs leave too little room.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify Rust toolchain
        run: scripts/piston/fetch-rust.sh "$RUNNER_TEMP/rust-dist"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: scripts/piston
          build-contexts: |
            rust-dist=${{ runner.temp }}/rust-dist
          platforms: linux/arm64
          load: true
          provenance: false
          build-args: |
            PISTON_SHA=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=canopy-piston
          cache-to: type=gha,mode=max,scope=canopy-piston
          tags: canopy-piston:ci

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run every version's starter
        run: |
          docker run -d --name piston --privileged -p 127.0.0.1:2000:2000 \
            -e PISTON_RUN_TIMEOUT=5000 -e PISTON_RUN_CPU_TIME=3000 \
            -e PISTON_COMPILE_TIMEOUT=15000 -e PISTON_COMPILE_CPU_TIME=10000 \
            -e PISTON_RUN_MEMORY_LIMIT=268435456 -e PISTON_COMPILE_MEMORY_LIMIT=536870912 \
            canopy-piston:ci
          for _ in $(seq 60); do curl -sf 127.0.0.1:2000/api/v2/runtimes >/dev/null && break; sleep 2; done
          docker exec piston du -sh /piston/packages/*/* | tee -a "$GITHUB_STEP_SUMMARY"
          docker image ls canopy-piston:ci | tee -a "$GITHUB_STEP_SUMMARY"
          node scripts/piston/verify-versions.mjs http://127.0.0.1:2000 | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      - name: Show engine logs
        if: failure()
        run: docker logs piston 2>&1 | tail -100

      - name: Push
        id: build
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: scripts/piston
          build-contexts: |
            rust-dist=${{ runner.temp }}/rust-dist
          platforms: linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            PISTON_SHA=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=canopy-piston
          cache-to: type=gha,mode=max,scope=canopy-piston
          tags: |
            ghcr.io/akatsukihq/canopy-piston:latest
            ghcr.io/akatsukihq/canopy-piston:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Piston code-execution engine for linux/arm64 with baked-in language packages

      - name: Publish digest to job summary
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          {
            echo "### canopy-piston image"
            echo
            echo "- Tags: \`latest\` and \`${TAG}\` (use the dated tag or digest to roll back)"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Pull on the VM: \`ghcr.io/akatsukihq/canopy-piston@${DIGEST}\`"
            echo
            echo "Deploy: provision.sh pulls :latest by default. Roll back with provision.sh ${TAG}."
          } >> "$GITHUB_STEP_SUMMARY"
